<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Speaker Player (host)</title>
<link rel="stylesheet" href="/style.css">
<style>
  .wrap { max-width: 960px; }
  #yt { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius); }
  #overlay {
    position: fixed; inset: 0; background: rgba(15,17,21,.96);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px;
  }
  #overlay h1 { margin: 0; }
  #overlay p { color: var(--muted); max-width: 460px; margin: 0; }
  #log { font-family: ui-monospace, monospace; font-size: 0.78rem; color: var(--muted); white-space: pre-wrap; max-height: 140px; overflow: auto; }
</style>
</head>
<body>
<div id="overlay">
  <h1>🔊 Speaker Player</h1>
  <p>This page plays the shared queue. Open it only on the PC that is connected to the Bluetooth speaker, and keep this tab open.</p>
  <div class="row">
    <input id="pin" type="password" placeholder="Host PIN" style="max-width:180px">
    <button id="startBtn">Start player</button>
  </div>
  <div id="startMsg" class="msg"></div>
</div>

<div class="wrap">
  <header>
    <h1>🔊 Speaker Player</h1>
    <span id="status" class="pill">connecting…</span>
  </header>
  <div id="yt"></div>
  <section class="card" style="margin-top:14px">
    <div id="nowTitle" class="title">Waiting for songs…</div>
    <div id="nowSub" class="sub"></div>
  </section>
  <section class="card">
    <h2>Log</h2>
    <div id="log"></div>
  </section>
  <footer>Queue page for everyone: <a id="queueLink" href="/">open</a></footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let pin = localStorage.getItem('hostPin') || '';
  let player = null, ready = false;
  let currentId = null;     // queue entry id currently loaded in the player
  let state = null;
  let errorTimer = null;

  $('pin').value = pin;
  $('queueLink').href = location.origin + '/';

  function log(msg) {
    const el = $('log');
    el.textContent = new Date().toLocaleTimeString() + '  ' + msg + '\n' + el.textContent;
    el.textContent = el.textContent.split('\n').slice(0, 60).join('\n');
  }

  async function api(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }

  // ---- YouTube IFrame API ----------------------------------------------
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('yt', {
      host: 'https://www.youtube.com',
      // origin + widget_referrer tell YouTube which page embeds the player.
      // Without them the embed often shows "An error occurred. Please try again later."
      playerVars: {
        autoplay: 1, controls: 1, rel: 0, playsinline: 1, enablejsapi: 1,
        origin: location.origin,
        widget_referrer: location.href,
      },
      events: {
        onReady: () => { ready = true; log('YouTube player ready'); sync(); },
        onStateChange: onPlayerState,
        onError: onPlayerError,
      },
    });
  };

  let consecutiveErrors = 0;
  function onPlayerState(e) {
    if (e.data === YT.PlayerState.PLAYING) consecutiveErrors = 0;
    if (e.data === YT.PlayerState.ENDED && currentId) {
      log('Song ended');
      const id = currentId; currentId = null;
      api('/api/player/ended', { pin, id, reason: 'ended' }).catch((err) => log('ended report failed: ' + err.message));
    }
    report();
  }

  function onPlayerError(e) {
    // 2: bad id, 5: html5 error, 100: not found, 101/150: embedding disabled
    const reasons = { 2: 'invalid video id', 5: 'HTML5 player error', 100: 'video not found or private', 101: 'embedding disabled by uploader', 150: 'embedding disabled by uploader', 153: 'YouTube cannot see the embedding page (referrer blocked)' };
    log('Player error ' + e.data + ' (' + (reasons[e.data] || 'unknown') + '), skipping');
    consecutiveErrors++;
    if (consecutiveErrors >= 3) {
      log('3 videos failed in a row. This is usually an ad blocker / tracking protection, a browser extension, or a VPN. Try this page in a fresh Edge or Chrome window with extensions disabled.');
    }
    if (!currentId) return;
    const id = currentId; currentId = null;
    api('/api/player/ended', { pin, id, reason: 'error' }).catch(() => {});
  }

  // Load whatever the server says is now playing, if it differs from what we have.
  function sync() {
    if (!ready || !state) return;
    const np = state.nowPlaying;
    if (!np) {
      if (currentId) { player.stopVideo(); currentId = null; }
      $('nowTitle').textContent = 'Waiting for songs…';
      $('nowSub').textContent = '';
      return;
    }
    if (np.id !== currentId) {
      currentId = np.id;
      $('nowTitle').textContent = np.title;
      $('nowSub').textContent = (np.author ? np.author + ' · ' : '') + 'added by ' + np.addedBy;
      log('Loading: ' + np.title);
      player.setVolume(state.playback.volume);
      player.loadVideoById(np.videoId);
      // Safety net: if the video never starts (rare), skip after 25 s.
      clearTimeout(errorTimer);
      errorTimer = setTimeout(() => {
        if (currentId === np.id && player.getPlayerState() !== YT.PlayerState.PLAYING && player.getPlayerState() !== YT.PlayerState.PAUSED) {
          log('Video did not start within 25 s, skipping');
          const id = currentId; currentId = null;
          api('/api/player/ended', { pin, id, reason: 'error' }).catch(() => {});
        }
      }, 25000);
    }
  }

  function onCommand(cmd) {
    if (!ready) return;
    if (cmd.type === 'pause') player.pauseVideo();
    else if (cmd.type === 'play') player.playVideo();
    else if (cmd.type === 'volume') player.setVolume(cmd.value);
    report();
  }

  // Heartbeat + progress to the server every 2 s.
  let reporting = false;
  async function report() {
    if (!ready || reporting) return;
    reporting = true;
    try {
      const st = player.getPlayerState();
      await api('/api/player/status', {
        pin,
        position: player.getCurrentTime() || 0,
        duration: player.getDuration() || 0,
        paused: st === YT.PlayerState.PAUSED,
        volume: player.getVolume(),
      });
      $('status').textContent = 'online'; $('status').className = 'pill on';
    } catch (err) {
      $('status').textContent = 'error: ' + err.message; $('status').className = 'pill off';
    } finally {
      reporting = false;
    }
  }
  setInterval(report, 2000);

  // ---- live updates -----------------------------------------------------
  function connect() {
    const es = new EventSource('/api/events');
    es.addEventListener('state', (ev) => { state = JSON.parse(ev.data); sync(); });
    es.addEventListener('cmd', (ev) => onCommand(JSON.parse(ev.data)));
    es.onerror = () => { es.close(); $('status').textContent = 'reconnecting…'; $('status').className = 'pill off'; setTimeout(connect, 2000); };
  }

  // ---- start (needs one click so the browser allows autoplay with sound) --
  async function start() {
    const p = $('pin').value;
    try {
      await api('/api/admin', { pin: p, action: 'check' });
    } catch (e) {
      $('startMsg').textContent = e.message; $('startMsg').className = 'msg err';
      return;
    }
    pin = p; localStorage.setItem('hostPin', p);
    try {
      const st = await (await fetch('/api/state')).json();
      if (st.playback && st.playback.engine === 'vlc') {
        $('startMsg').innerHTML = 'This server plays audio through VLC on the host PC, so this page is not needed. Use the <a href="/">queue page</a> instead. (Start the server with PLAYER=browser to use this page.)';
        $('startMsg').className = 'msg ok';
        return;
      }
    } catch (_) { /* fall through, server will tell us */ }
    $('overlay').style.display = 'none';
    connect();
    report();
    // Keep the tab from sleeping if the browser supports it.
    if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
    log('Player started. Keep this tab open.');
  }
  $('startBtn').onclick = start;
  $('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });
})();
</script>
</body>
</html>
